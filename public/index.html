                    });
                }
            }, [data, sortBy]); // Re-render chart if data changes

            const variancePercent = ((data.summary.totalRealCost - data.summary.totalStdCost) / data.summary.totalStdCost) * 100;
            const monthName = new Date(2024, data.monthIndex - 1, 1).toLocaleString('es-MX', { month: 'long' });

            // Dynamic Conclusions Generator
            const generateConclusions = () => {
                const totalVar = data.summary.variance;
                const isLoss = totalVar < 0; // Negative = Loss
                const topLossItem = (data.details && data.details[0]) || { name: 'N/A', totalVariance: 0 };
                const efficiency = (data.summary.efficiency * 100).toFixed(1);

                return (
                    <div className="bg-slate-50 rounded-xl p-6 border border-slate-200 text-slate-700 space-y-4">
                        <h4 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <svg className="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>

            console.log("DEBUG Dashboard - history map:", history.map(h => h.monthIndex + '-' + h.year));
            console.log("DEBUG Dashboard - prevMonth Found:", !!prevMonth, "dMonth:", Number(data.monthIndex), "hMonth (if any):", prevMonth ? prevMonth.monthIndex : 'N/A');

                                    Confirmar y Guardar

                    {(!data.runs || data.runs.length === 0) && (

                            <h3 className="font-bold text-red-900">Datos Detallados No Disponibles</h3>
                            <p className="text-red-700">Este registro histórico es antiguo y no contiene el detalle de "runs" necesario para el Dashboard completo. <br />Por favor elimina este mes y cárgalo nuevamente para ver el análisis completo.</p>
                        </div>
                    )}

                    {selectedSku && <ProductDetail data={data} sku={selectedSku} onClose={() => setSelectedSku(null)} />}

                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <div>
                            <h2 className="text-xl font-bold text-slate-900">Resultados: Mes {data.monthIndex}</h2>
                            <p className="text-sm text-slate-500">Basado en {data.runs.length} registros de producción</p>

                        {!isPreview && (

                    {/* KPI CARDS (Reuse existing Card component structure) */}

                        <Card title="Desviación (Merma)" value={formatCurrencyInt(data.summary.variance)} subtext={`${variancePercent.toFixed(1)}% sobre el estándar`} type={data.summary.variance < 0 ? 'danger' : 'success'} />
                        <Card title="Eficiencia Financiera" value={(data.summary.efficiency * 100).toFixed(1) + '%'} subtext="Target: 98%+" type={data.summary.efficiency < 0.98 ? 'warning' : 'success'} />

                    {/* DETAILS & FILTER */}

                                    let skuVar = 0;
                                    let orderCount = rawRuns.length;

                                    if (rawRuns.length > 0) {
                                        skuVar = rawRuns.reduce((acc, r) => acc + r.variance, 0);
                                    } else if (data.skuDetails) {
                                        const det = data.skuDetails.find(d => d.sku === sku);
                                        if (det) skuVar = det.totalVar;

                                    return (
                                        <button key={sku} onClick={() => setSelectedSku(sku)} className="w-full text-left p-3 rounded-lg border border-slate-100 hover:border-blue-300 hover:bg-blue-50 transition-all flex justify-between items-center group relative overflow-hidden">

                                                <div className="font-medium text-slate-700 group-hover:text-blue-700 truncate">{sku}</div>
                                                <div className="text-xs text-slate-400">{orderCount} órdenes</div>
                                            </div>
                                            <div className={`text-sm font-bold whitespace-nowrap ${skuVar < 0 ? 'text-red-500' : 'text-green-500'}`}>{skuVar > 0 ? '+' : ''}{formatCurrency(skuVar)}</div>
                                        </button>
                                    )
                                })}
                            </div>
                        </div>
                    </div>



                    {/* NEW: Unit Cost Comparison Table */}
                    <UnitCostComparisonTable currentMonth={data} prevMonth={prevMonth} />
                </div>
            );
        };

        // --- AI Chat Logic & Components ---

        class AIService {
            static getApiKey() {
                return localStorage.getItem('openrouter_api_key');
            }

            static setApiKey(key) {
                localStorage.setItem('openrouter_api_key', key);
            }

            static getModelId() {
                return localStorage.getItem('openrouter_model_id') || "google/gemini-1.5-flash";
            }

            static setModelId(id) {
                localStorage.setItem('openrouter_model_id', id);
            }

            static async generateResponse(prompt, contextData) {
                const apiKey = this.getApiKey();
                if (!apiKey) throw new Error("API Key faltante");

                const contextString = JSON.stringify(contextData, null, 2);
                const systemPrompt = `Eres un analista financiero experto. Tu trabajo es ayudar al usuario a entender sus costos de producción.
            
            Usa el siguiente contexto JSON (datos del mes actual) para responder:
            ${contextString}
            
            Reglas:
            1. Responde en español de negocios, profesional pero directo.
            2. Usa formato Markdown para listas o negritas.
            3. Sé conciso. No divagues. Ve al punto.
            4. Si te preguntan por un producto, búscalo en el contexto y da detalles específicos (Costo Real, Variación).
            5. Si la variación es negativa (roja), explica que es un incremento de costo. Si es positiva (verde), es un ahorro.
            `;

                try {
                    // Fix: OpenRouter requires a valid HTTP-Referer. 
                    const isLocal = window.location.protocol === 'file:' || window.location.origin === 'null';
                    const referer = isLocal ? 'https://cost-analyzer.local' : window.location.href;

                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKey.trim()}`,
                            "HTTP-Referer": referer,
                            "X-Title": "Cost Analyzer App",
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            // CHANGED: Use User-Configured Model ID
                            "model": this.getModelId(),
                            "messages": [
                                { "role": "system", "content": systemPrompt },
                                { "role": "user", "content": prompt }
                            ]
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        console.error("OpenRouter Error Full:", errorData);
                        // Show more detail to the user
                        const code = errorData.error?.code || response.status;
                        const msg = errorData.error?.message || (errorData.error ? JSON.stringify(errorData.error) : "Error desconocido");
                        throw new Error(`OpenRouter (${code}): ${msg}`);
                    }

                    const data = await response.json();
                    if (!data.choices || data.choices.length === 0) return "Sin respuesta.";
                    return data.choices[0].message.content;
                } catch (error) {
                    console.error("AI Error:", error);
                    throw error;
                }
            }
        }

        const SettingsModal = ({ isOpen, onClose, onSave }) => {

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[60] backdrop-blur-sm">

                                value={apiKey}

        const AIChatWidget = ({ currentData, history }) => {
            const [isOpen, setIsOpen] = React.useState(false);
            const [messages, setMessages] = React.useState([
                { role: 'assistant', content: '¡Hola! Soy tu analista financiero IA. Pregúntame sobre los costos o eficiencias de este mes.' }

            const handleSend = async () => {
                if (input.trim()) {
                    console.log("DEBUG: Sending to AI. History context:", history);
                }

                const userMsg = input;
                setMessages(prev => [...prev, { role: 'user', content: userMsg }]);
                setInput("");
                setIsLoading(true);

                try {
                    // Prepare context: 
                    // 1. Current Month Detail (if available)
                    const currentContext = currentData ? {
                        month: currentData.name,
                        kpis: currentData.kpiCards,
                        // Top 30 items by Variance
                        topVariations: currentData.details
                            .sort((a, b) => Math.abs(b.totalVariance) - Math.abs(a.totalVariance))
                            .slice(0, 30)
                            .map(i => ({
                                sku: i.name,
                                realCost: i.totalReal,
                                stdCost: i.totalStandard,
                                variance: i.totalVariance,
                                vol: i.producedPieces
                            }))
                    } : null;

                    // 2. PRE-CALCULATED CONTEXT TABLES (The "Source of Truth" for AI)

                    // A. Monthly Summaries Table (For "Worst Month", "Best Month" questions)
                    let monthlySummaryCSV = "Ano,Mes,Mes_Nombre,Costo_Real_Total,Costo_Std_Total,Variacion_Dinero,Merma_Absoluta,Eficiencia_Pct\n";

                    // B. Product History Detail (For "History of SKU X" questions)
                    let productHistoryCSV = "Ano,Mes,Tipo,SKU,Descripcion,Costo_Real,Costo_Estandar,Variacion_Merma,Merma_Absoluta\n";

                    // C. Annual Totals (For "Total Annual Loss of SKU X")
                    const annualAggregates = {};
                    const monthlyDataRows = [];

                    if (history) {
                        history.forEach(h => {
                            const year = h.year || 2024;
                            const monthIdx = h.monthIndex;
                            const monthName = h.monthName || "Desconocido";

                            // 1. Populate Monthly Summary
                            // FIX: Re-calculate totals from skuDetails to ensure consistency with detailed tables
                            // usage of h.summary can be stale. 
                            let mReal = 0;
                            let mStd = 0;

                            // Prefer skuDetails (comprehensive) over details (top 30)
                            const sourceData = (h.skuDetails && h.skuDetails.length > 0) ? h.skuDetails : h.details;

                            if (sourceData) {
                                mReal = sourceData.reduce((acc, item) => acc + (item.totalReal || 0), 0);
                                mStd = sourceData.reduce((acc, item) => acc + (item.totalStd || item.totalStandard || 0), 0);
                            } else if (h.summary) {
                                // Fallback
                                mReal = h.summary.totalRealCost;
                                mStd = h.summary.totalStdCost;
                            }

                            const mVar = mStd - mReal;
                            const mEff = mReal > 0 ? (mStd / mReal) : 0;

                            const mAbs = mVar < 0 ? Math.abs(mVar) : 0;
                            monthlyDataRows.push({
                                line: `${year},${monthIdx},${monthName},${mReal.toFixed(2)},${mStd.toFixed(2)},${mVar.toFixed(2)},${mAbs.toFixed(2)},${(mEff * 100).toFixed(1)}%`,
                                absWaste: mAbs
                            });

                            // 2. Populate Product History & Annual Aggregates

                            // Helper to process items
                            const processItem = (d, type) => {
                                // Variance calc
                                const real = d.totalReal || 0;
                                const std = d.totalStd || d.totalStandard || 0;
                                const v = std - real;

                                // Add to Product CSV
                                // Clean description to remove commas/quotes that break CSV
                                const cleanDesc = (d.description || d.name || d.sku).replace(/[",]/g, ' ');
                                const cleanSku = (d.sku || d.name).replace(/[",]/g, '');

                                const vAbs = v < 0 ? Math.abs(v) : 0;
                                // Optimization: Only add rows with non-zero values to save tokens
                                if (Math.abs(real) > 0.1 || Math.abs(std) > 0.1) {
                                    productHistoryCSV += `${year},${monthIdx},${type},"${cleanSku}","${cleanDesc}",${real.toFixed(2)},${std.toFixed(2)},${v.toFixed(2)},${vAbs.toFixed(2)}\n`;
                                }

                                // Accumulate Annual
                                const aggKey = cleanSku;
                                if (!annualAggregates[aggKey]) annualAggregates[aggKey] = { type, desc: cleanDesc, real: 0, std: 0, var: 0 };
                                annualAggregates[aggKey].real += real;
                                annualAggregates[aggKey].std += std;
                                annualAggregates[aggKey].var += v;
                            };

                            // Process Finished Goods
                            if (h.skuDetails) h.skuDetails.forEach(d => processItem(d, 'PRODUCTO_TERMINADO'));

                            // Process Materials (only significant ones to save space)
                            if (h.details) {
                                h.details.forEach(d => {
                                    // DEBUG: Log specific material to trace values
                                    if (d.name && d.name.includes("BLANQUEADOR")) {
                                        console.log(`DEBUG MATERIA: ${d.name} | Real: ${d.totalReal} | Var: ${d.totalVariance} | Month: ${h.monthName}`);
                                    }

                                    if (Math.abs(d.totalVariance) > 0.1 || Math.abs(d.totalReal) > 1) { // Threshold reduced to capture almost all materials
                                        const matItem = { ...d, sku: d.name }; // Materials often use name as ID
                                        processItem(matItem, 'MATERIA_PRIMA');
                                    }
                                });
                            }
                        });
                    }

                    // Sort monthly data by Absolute Waste descending (Biggest loss first)
                    monthlyDataRows.sort((a, b) => b.absWaste - a.absWaste);
                    monthlySummaryCSV += monthlyDataRows.map(r => r.line).join('\n');

                    // D. Finalize Annual Totals CSV
                    let annualTotalsCSV = "Tipo,SKU,Descripcion,Total_Real_Anual,Total_Estandar_Anual,Total_Variacion_Anual,Total_Merma_Absoluta_Anual\n";
                    Object.keys(annualAggregates).forEach(key => {
                        const d = annualAggregates[key];
                        // Calc annual absolute loss if net is negative
                        const annualAbs = d.var < 0 ? Math.abs(d.var) : 0;
                        annualTotalsCSV += `${d.type},"${key}","${d.desc}",${d.real.toFixed(2)},${d.std.toFixed(2)},${d.var.toFixed(2)},${annualAbs.toFixed(2)}\n`;
                    });

                    console.log("DEBUG: Context Sizes -> Monthly:", monthlySummaryCSV.length, "Product:", productHistoryCSV.length, "Annual:", annualTotalsCSV.length);

                    const fullContext = {
                        instruction: `
                        Actúa como un Auditor Financiero Senior. Tienes acceso a TRES TABLAS de datos VERIFICADOS:

                        1. "monthlySummaryCSV": Resumen de ALTO NIVEL por mes (Con Merma Absoluta).
                           - USA ESTA TABLA para preguntas como "¿Cuál fue el peor mes?" o "¿Quién tuvo mayor merma?".
                           - NO SUMES manualmente.
                           - COLUMNA CLAVE: "Merma_Absoluta". El valor MÁS ALTO en esta columna indica el PEOR mes. Confía en esto sobre la columna de signos negativos.

                        2. "productHistoryCSV": Detalle MES A MES por Producto/Material.
                           - USA ESTA TABLA para ver la evolución de un producto específico.
                           - Tambien incluye "Merma_Absoluta".
                           
                        3. "annualTotalsCSV": Acumulado ANUAL por Producto.
                           - USA ESTA TABLA para totales del año (Ej: "¿Cuánto perdió el SKU-500 en todo 2024?").
                        
                        REGLAS DE ORO:
                        - CONFIA 100% en los números de estas tablas. No intentes recalcular totales sumando filas, usa los totales ya dados.
                        - FORMATO DE NÚMEROS: SIEMPRE usa separadores de miles y dos decimales en tus respuestas ($150,000.00). Nunca uses formato crudo (150000.5).
                        - Cuando respondas, cita el mes y año específico de los datos.
                        `.replace(/\s+/g, ' '),
                        currentView: currentContext,
                        monthlySummaryCSV: monthlySummaryCSV,
                        productHistoryCSV: productHistoryCSV,
                        annualTotalsCSV: annualTotalsCSV
                    };

                    const responseText = await AIService.generateResponse(userMsg, fullContext);
                    setMessages(prev => [...prev, { role: 'assistant', content: responseText }]);

                } catch (error) {
                    if (error.message.includes("API Key") || (error.message && error.message.toLowerCase().includes("key"))) {
                        setMessages(prev => [...prev, { role: 'assistant', content: "Necesito tu API Key para funcionar. Configúrala en el engranaje de arriba." }]);
                        setShowSettings(true);
                    } else {
                        setMessages(prev => [...prev, { role: 'assistant', content: `Error: ${error.message}. Intenta de nuevo.` }]);
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            const handleSaveKey = (key, modelId) => {
                AIService.setApiKey(key);
                if (modelId) AIService.setModelId(modelId);
                setShowSettings(false);
                setMessages(prev => [...prev, { role: 'assistant', content: "¡Conexión y Modelo guardados! ¿En qué puedo ayudarte?" }]);
            };

            return (
                <React.Fragment>
                    {/* Floating Button */}
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className={`fixed bottom-6 right-6 p-4 rounded-full shadow-2xl z-50 transition-all duration-300 flex items-center justify-center ${isOpen ? 'bg-red-500 rotate-45' : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:scale-110'}`}
                    >
                        {isOpen ? (

                        ) : (
                            <i data-lucide="sparkles" className="text-white w-6 h-6 animate-pulse"></i>
                        )}
                    </button>

                    {/* Chat Window */}
                    {isOpen && (
                        <div className="fixed bottom-24 right-6 w-96 h-[500px] bg-white dark:bg-gray-800 rounded-2xl shadow-2xl flex flex-col z-50 border border-gray-200 dark:border-gray-700 overflow-hidden chat-bubble-enter">
                            {/* Header */}
                            <div className="bg-gradient-to-r from-blue-600 to-indigo-700 p-4 flex justify-between items-center text-white">
                                <div className="flex items-center gap-2">
                                    <i data-lucide="bot" className="w-5 h-5"></i>
                                    <span className="font-bold">IA Analista</span>
                                </div>
                                <button onClick={() => setShowSettings(true)} className="hover:text-blue-200 transition">
                                    <i data-lucide="settings" className="w-5 h-5"></i>
                                </button>
                            </div>

                            {/* Messages Area */}
                            <div className="flex-1 overflow-y-auto p-4 bg-gray-50 dark:bg-gray-900 space-y-4">
                                {messages.map((msg, idx) => (
                                    <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[85%] rounded-2xl px-4 py-3 shadow-sm text-sm ${msg.role === 'user'
                                            ? 'bg-blue-600 text-white rounded-tr-none'
                                            : 'bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 rounded-tl-none prose-sm'
                                            }`}>
                                            {msg.role === 'assistant' ? (
                                                <div dangerouslySetInnerHTML={{ __html: window.marked ? marked.parse(msg.content) : msg.content }} />
                                            ) : (
                                                msg.content
                                            )}
                                        </div>
                                    </div>
                                ))}
                                {isLoading && (
                                    <div className="flex justify-start">
                                        <div className="bg-white dark:bg-gray-800 rounded-2xl px-4 py-3 shadow-sm border border-gray-200 dark:border-gray-700">
                                            <div className="flex gap-1">

                                <div ref={messagesEndRef} />

                                <input
                                    type="text"

                                    onChange={(e) => setInput(e.target.value)}

          const SecureApp = () => {
            const [session, setSession] = useState(null);

            const [email, setEmail] = useState('');

            const [showAdminModal, setShowAdminModal] = useState(false);

            const loadProfile = async (user) => {
                let { data: prof, error } = await window.supabase.from('profiles').select('role, email, allowed_companies').eq('id', user.id).single();
                if (!prof) {
                    await window.supabase.from('profiles').insert({ id: user.id, email: user.email, role: 'pending' });
                    prof = { role: 'pending', email: user.email };
                } else if (!prof.email && user.email) {
                    await window.supabase.from('profiles').update({ email: user.email }).eq('id', user.id);
                    prof.email = user.email;
                }
                window.authProfile = prof; setProfile(prof); if (prof) window.overrideHistoryManager(prof.role);
            };

            useEffect(() => {
                window.supabase.auth.getSession().then(({ data: { session } }) => {
                    if (session) {
                        window.currentUser = session.user;
                        loadProfile(session.user).then(() => {
                            window.loadHistoryFromCloud().then(() => {
                                setSession(session);
                                setLocalLoading(false);
                            });
                        });
                    } else {
                        setSession(null);
                        setLocalLoading(false);
                    }
                });

                const {
                    data: { subscription },
                } = window.supabase.auth.onAuthStateChange((_event, session) => {
                    if (session) {
                        window.currentUser = session.user;
                        loadProfile(session.user).then(() => {
                            window.loadHistoryFromCloud().then(() => {
                                setSession(session);
                            });

                        setProfile(null);
                    }

                return () => subscription.unsubscribe();
            }, []);

            const [isRegistering, setIsRegistering] = useState(false);

                e.preventDefault();
                setLocalLoading(true);
                setAuthError('');
                
                if (isRegistering) {
                    const { data, error } = await window.supabase.auth.signUp({ email, password });
                    if (error) {
                        setAuthError(error.message || 'Error al registrar usuario');
                    } else {
                        // Sincronizar el correo inmediatamente después de registrar
                        if (data?.user?.id) {
                            await window.supabase.from('profiles').update({ email }).eq('id', data.user.id);
                        }
                        setAuthError('¡Registro exitoso! Por favor inicia sesión ahora.');
                        setIsRegistering(false);
                    }
                    setLocalLoading(false);
                } else {
                    const { error } = await window.supabase.auth.signInWithPassword({ email, password });
                    if (error) setAuthError('Credenciales inválidas');
                    setLocalLoading(false);

            const handleLogout = async () => {

             const activeCompanyObj = CompanyManager.getActiveCompany() || {id: 'default', name: 'Grupo Alphalab de M'};
               const activeCompany = activeCompanyObj.name;
               const activeCompanyId = activeCompanyObj.id;
             
             // Inject the Auth Pill via MutationObserver so it survives React renders
             const observer = new MutationObserver(() => {
                 const buttons = Array.from(document.querySelectorAll('button'));
                 const loadButton = buttons.find(b => b.textContent && b.textContent.includes('Cargar / Analizar'));
                 
                 // Role Restrictions logic: Hide Cargar for Viewer
                 if (profileRole === 'viewer') {
                     if (loadButton && loadButton.style.display !== 'none') {

                 if (loadButton && !document.getElementById('auth-pill-injected') && profileRole) {
                     const pill = document.createElement('div');
                     pill.id = 'auth-pill-injected';
                     pill.className = 'flex items-center gap-3 bg-blue-50/50 w-fit px-4 py-1.5 rounded-full border border-blue-200/60 shadow-sm mr-4';
                     pill.innerHTML = `

                           <span class="text-[9px] bg-blue-600 text-white px-2 py-0.5 rounded ml-1 tracking-widest font-black uppercase">${profileRole === 'viewer' ? 'LECTOR' : (profileRole === 'operator' ? 'OPERADOR' : 'ADMIN')}</span>
                        </span>
                        <button type="button" onclick="window.returnToHome()" class="text-[10px] text-slate-700 font-bold hover:bg-slate-200 px-3 py-1 rounded-full transition-colors ml-4 uppercase tracking-widest">Volver a Inicio</button><button type="button" onclick="window.appLogout()" class="text-[10px] text-red-600 font-bold hover:bg-red-100 px-3 py-1 rounded-full transition-colors ml-4 border border-red-200 uppercase tracking-widest">Cerrar Sesión</button>
                     `;
                     loadButton.parentNode.insertBefore(pill, loadButton);
                 }
             });
             observer.observe(document.body, { childList: true, subtree: true });
             
                            // --- COMPANY MANAGER OVERRIDE ---
               const originalGetCompanies = CompanyManager.getCompanies;
               CompanyManager.getCompanies = () => {
                    let comps = originalGetCompanies();
                    const prof = window.authProfile;
                    if (prof && prof.allowed_companies && prof.allowed_companies !== 'ALL') {
                         const allowed = prof.allowed_companies.split(',').map(s=>s.trim());
                         comps = comps.filter(c => allowed.includes(c.name));
                         if (comps.length === 0) comps = [{id: 'none', name: 'ACCESO RESTRINGIDO - Contacta a Miguel'}];
                    }
                    return comps;
               };

               // --- OVERRIDE UPDATE MONTH FOR COMMENTS ---
               if (!window.originalUpdateMonth) {
                   window.originalUpdateMonth = HistoryManager.updateMonth;
                   HistoryManager.updateMonth = (compOrMonth, yearOrMonth, monthOrUpdates, updatesObj) => {
                       if (profileRole === 'viewer') return null;
                       
                       let company, year, monthIndex, updates;
                       if (typeof compOrMonth === 'string' && typeof yearOrMonth === 'number') {
                           company = compOrMonth;
                           year = yearOrMonth;
                           monthIndex = monthOrUpdates;
                           updates = updatesObj;
                       } else {
                           monthIndex = compOrMonth;
                           year = yearOrMonth;
                           updates = monthOrUpdates;
                           const obj = CompanyManager.getActiveCompany();
                           company = obj ? obj.name : 'default';
                       }
                       
                       // OriginalApp bug fix: pass only the 3 arguments it famously expects
                       const result = window.originalUpdateMonth(monthIndex, year, updates);
                       preloadedHistory = [...preloadedHistory];
                       if (result) {
                           const updatedRow = HistoryManager.load().find(h => h.year === year && h.monthIndex === monthIndex);
                           if (updatedRow) {
                               
                                 console.log("INTENTANDO ACTUALIZAR CON ESTAS LLAVES EXACTAS:", { company_id: activeCompanyId, year: year, month_index: monthIndex });
                                 window.supabase.from('monthly_history')
                                    .update({ summary_jsonb: updatedRow })
                                    .match({ company_id: activeCompanyId, year: year, month_index: monthIndex })
     .select()
     .then(({data, error}) => { 
         if(error) console.error('Error syncing:', error); 
         else {
             console.log('SUPABASE SAVE RESULT:', data);
             if (data && data.length === 0) {
                 console.error('CRITICAL: Supabase accepted the request but updated ZERO rows! This means Row Level Security (RLS) is blocking you, or the company_id/year/month match failed!');
             }
         }
     });
                           }
                       }
                       return result;
                   };
               }

               // --- ADMIN DELETE COMPANY BUTTON ---
               if (profileRole === 'admin') {
                   const observerAdmin = new MutationObserver(() => {
                        const selectBtn = Array.from(document.querySelectorAll('button')).find(b => b.textContent && b.textContent.includes('Nueva Empresa'));
                        if (selectBtn && !document.getElementById('delete-company-btn')) {
                             const delBtn = document.createElement('button');
                             delBtn.id = 'delete-company-btn';
                             delBtn.className = 'w-full text-left px-4 py-2 hover:bg-red-50 text-red-600 transition-colors flex items-center gap-2 font-bold text-xs mt-2 border-t border-red-100';
                             delBtn.innerHTML = '??? Eliminar Empresa Actual';
                             delBtn.onclick = async () => {
                                 if(confirm('�Est�s seguro de eliminar ' + activeCompany + ' de forma permanente?')) {
                                     await window.supabase.from('monthly_history').delete().eq('company_id', activeCompanyId);
                                     await window.supabase.from('production_runs').delete().eq('company_id', activeCompanyId);
                                     let comps = CompanyManager.getCompanies().filter(c => c.name !== activeCompany);
                                     if (comps.length === 0) comps.push({ id: 'default', name: 'Grupo Alphalab de M�xico' });
                                     localStorage.setItem(CompanyManager.STORAGE_KEY, JSON.stringify(comps));
                                     localStorage.setItem(CompanyManager.CURRENT_KEY, comps[0].id);
                                     window.location.reload();
                                 }
                             };
                             selectBtn.parentNode.appendChild(delBtn);
                        }
                   });
                   observerAdmin.observe(document.body, { childList: true, subtree: true });
               }

                // WE PRELOAD THE HISTORY SO THE SYNCHRONOUS APP DOESN'T BREAK!
              let preloadedHistory = window._globalPreloadedHistory || [];
              
              // Replace load function
              HistoryManager.load = () => {
                  return preloadedHistory;
              };
             
             // This function must be called on mount to fetch data from Supabase DB
             window.loadHistoryFromCloud = async () => {
                 const {data, error} = await window.supabase.from('monthly_history').select('*').eq('company_id', activeCompanyId).order('year', {ascending: true}).order('month_index', {ascending: true});
                 if (error) {
                     console.error("Cloud DB Error", error);
                     return;
                 }
                 
                 const historyIds = data.map(r => r.id);
                 let allRuns = [];
                 if (historyIds.length > 0) {
                     // Fetch runs per month with pagination to avoid the 1000 rows limit
                     for (let hid of historyIds) {
                         let fromIndex = 0;
                         let step = 1000;
                         while (true) {
                             const {data: runsData, error: runsError} = await window.supabase
                                 .from('production_runs')
                                 .select('history_id, run_data')
                                 .eq('history_id', hid)
                                 .range(fromIndex, fromIndex + step - 1);
                             
                             if (!runsError && runsData && runsData.length > 0) {
                                 allRuns.push(...runsData);
                                 if (runsData.length < step) break; // Finished this month
                                 fromIndex += step;
                             } else {
                                 break;
                             }
                         }
                     }
                 }

                 preloadedHistory = data.map(row => {
                     const monthRuns = allRuns.filter(r => r.history_id === row.id).map(r => r.run_data);
                     return {
                         id: row.id,
                         created_at: row.created_at,
                         timestamp: row.created_at,
                         year: row.year,
                         monthIndex: row.month_index,
                         monthName: new Date(row.year, row.month_index - 1, 1).toLocaleString('es-MX', { month: 'long' }),
                         summary: row.summary_jsonb.summary,
                         details: row.summary_jsonb.details || [],
                         skuDetails: row.summary_jsonb.skuDetails || [],
                         runs: monthRuns,
                         boms: row.summary_jsonb.boms || {},
                         comments: row.summary_jsonb.comments || {}
                     };
                 });
                 window._globalPreloadedHistory = preloadedHistory;
             };

             HistoryManager.saveMonth = async (data) => {
                 // 1. Save to monthly_history (WITHOUT runs, to keep summary JSONB small)
                 const historyPayload = {
                     company_id: activeCompanyId, company_name: activeCompany,
                     month_index: data.monthIndex,
                     year: data.year || new Date().getFullYear(),
                     summary_jsonb: {
                         summary: data.summary,
                         details: data.details,
                         skuDetails: data.skuDetails,
                         boms: data.boms,
                         comments: data.comments || {}
                         // NOTICE: runs are EXCLUDED here to match the schema
                     }
                 };
                 
                 const { data: historyRow, error: historyError } = await window.supabase
                     .from('monthly_history')
                     .insert(historyPayload)
                     .select()
                     .single();

                 if (historyError) {
                     if (historyError.code === '23505' || historyError.message.includes('duplicate key')) {
                         alert("Error: Este mes ya existe en la Nube. Borra el mes anterior primero desde tu panel de gráficas.");
                     } else {
                         alert("Error guardando historial general en Supabase: " + historyError.message);
                     }
                     return false;
                 }

                 // 2. Save runs to production_runs
                 if (data.runs && data.runs.length > 0) {
                     const productionRuns = data.runs.map(r => ({
                         history_id: historyRow.id,
                         sku: r.sku,
                         run_data: r
                     }));

                     const chunkSize = 1000;
                     for (let i = 0; i < productionRuns.length; i += chunkSize) {
                         const chunk = productionRuns.slice(i, i + chunkSize);
                         const { error: runsError } = await window.supabase.from('production_runs').insert(chunk);
                         if (runsError) {
                             console.error("Error validando chunk de runs", runsError);
                             alert("Error cargando el detalle completo de producción. La información básica sí se guardó.");
                             return false;
                         }
                     }
                 }
                 
                 alert("¡Carga masiva exitosa a la Nube Segura (Producción + Runs)!");
                 window.location.reload(); // Recarga la página para destruir el "MODO VISTA PREVIA"
                 return true;
             };
             
             HistoryManager.deleteMonth = async (monthIndex, year) => {
                  try {
                      // Because of ON DELETE CASCADE, deleting the history deletes the production_runs!
                      const { error } = await window.supabase.from('monthly_history').delete()
                            .eq('company_name', activeCompany)
                            .eq('month_index', monthIndex)
                            .eq('year', year || new Date().getFullYear());
                      
                      if (error) console.error(error);
                      await window.loadHistoryFromCloud();
                      window.location.reload();
                  } catch(e) {}
                  return null;
             };
        };

        // Now start the React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        
        // Wrapper Component to handle the asynchronous pre-loading of data before rendering OriginalApp
        const AsyncCloudBootstrapper = () => {
            const [ready, setReady] = useState(false);
            useEffect(() => {
                window.overrideHistoryManager();
                window.loadHistoryFromCloud().then(() => setReady(true));
            }, []);
            
            if (!ready) return <div className="p-10 text-center text-blue-600 font-bold animate-pulse text-lg">Sincronizando con Supabase Cloud...</div>;
            return <SecureApp />;
        };

        root.render(<AsyncCloudBootstrapper />);


        // Add simple CSS animation for fade-in
        const style = document.createElement('style');
        style.textContent = `
          @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
          }
          .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
          .animate-fade-in { animation: fadeInUp 0.4s ease-out forwards; }
        `;
        document.head.appendChild(style);
    </script>

    <script>
        // Icon replacement helper for after React renders
        window.addEventListener('load', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>

</html>
