    <!-- MAIN APP SCRIPT INLINED TO ADVOID CORS ISSUES -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- UTILS ---
        const formatCurrency = (val) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(val);
        const formatCurrencyInt = (val) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0, minimumFractionDigits: 0 }).format(val);
        const formatNumber = (val) => new Intl.NumberFormat('es-MX').format(val);

        // --- COMPONENTS ---

        const Card = ({ title, value, subtext, type = 'neutral' }) => {
            const colors = {
                neutral: 'bg-white border-gray-200',
                danger: 'bg-red-50 border-red-200 text-red-700',
                success: 'bg-green-50 border-green-200 text-green-700',
                warning: 'bg-amber-50 border-amber-200 text-amber-700',
            };
            return (
                <div className={`p-6 rounded-xl border shadow-sm ${colors[type]}`}>
                    <h3 className="text-sm font-medium opacity-70 mb-1 uppercase tracking-wide">{title}</h3>
                    <div className="text-3xl font-bold tracking-tight">{value}</div>
                    {subtext && <div className="text-sm mt-2 opacity-80">{subtext}</div>}
                </div>
            );
        };

        const UploadZone = ({ onDataProcessed }) => {
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [existingHistory, setExistingHistory] = useState([]);

            useEffect(() => {
                setExistingHistory(HistoryManager.load());
            }, []);
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
            const [selectedMonth, setSelectedMonth] = useState("");

            const isLocked = existingHistory.some(h => h.monthIndex == selectedMonth && h.year == selectedYear);

            const months = [
                { val: 1, label: 'Enero' }, { val: 2, label: 'Febrero' }, { val: 3, label: 'Marzo' },
                { val: 4, label: 'Abril' }, { val: 5, label: 'Mayo' }, { val: 6, label: 'Junio' },
                { val: 7, label: 'Julio' }, { val: 8, label: 'Agosto' }, { val: 9, label: 'Septiembre' },
                { val: 10, label: 'Octubre' }, { val: 11, label: 'Noviembre' }, { val: 12, label: 'Diciembre' }
            ];

            const downloadTemplate = () => {
                const headers = [
                    "Mes", "SEMANA", "ORDEN DE PRODUCCION", "SKU PRODUCIDO", "DESCRIPCION SKU PRODUCIDO",
                    "TOTAL PIEZAS FABRICADAS", "Orden Producción Confirmacion", "SKU MATERIA PRIMA",
                    "DESCRIPCION SKU MATERIA PRIMA", "UNIDAD DE MEDIDA", "Materia Prima Real Consumido",
                    "Costo Unitario Promedio", "Importe Total Materia Prima", "Material Estandar Requerido",
                    "Variación Estandar vs Real Consumido", "Importe de la variación"
                ];

                const sampleRow = [
                    1, 3, "ORD-6171-P", "ENVPET1LTR", "ENVASE PET 1 LT", 10584, "ORD-6171-P",
                    "PREFOR30GR", "PREFORMA 30 GR", "Pza", 10879, "$ 1.30", "$ 14,149.83", 10584, -295, "-$ 383.69"
                ];

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet([headers, sampleRow]);
                XLSX.utils.book_append_sheet(wb, ws, "Reporte_Detallado");
                XLSX.writeFile(wb, "Plantilla_Costos_Mermas.xlsx");
            };

            const cleanCurrency = (val) => {
                if (typeof val === 'number') return val;
                if (!val) return 0;
                const cleanStr = val.toString().replace(/[$,]/g, '').trim();
                return parseFloat(cleanStr) || 0;
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setLoading(true);
                setError(null);

                try {
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data);
                    const sheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];

                    // --- FORCE EXPAND RANGE TO 3500 ROWS (User Request for 2026 growth) ---
                    if (sheet['!ref']) {
                        const range = XLSX.utils.decode_range(sheet['!ref']);
                        // Extend at least to row 3500 (index 3499 if 0-based, but ranges are 0-based so 3500 is row 3501)
                        if (range.e.r < 10000) {
                            range.e.r = 10000;
                            sheet['!ref'] = XLSX.utils.encode_range(range);
                        }
                    }

                    const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                    if (jsonData.length < 2) throw new Error("El archivo está vacío");

                    // VALIDATION LOGIC
                    // 1. Check Data Month vs Selected Month
                    // Column 0 is "Mes" (1-based index)
                    // We scan all valid data rows
                    const rows = jsonData.slice(1).filter(r => r && r.length > 5 && r[0] != undefined);
                    const distinctMonths = [...new Set(rows.map(r => parseInt(r[0])))].filter(m => !isNaN(m));

                    if (distinctMonths.length === 0) {
                        throw new Error("No se pudo detectar la columna 'Mes' en el archivo. Verifica el formato.");
                    }

                    if (distinctMonths.length > 1) {
                        throw new Error(`El archivo contiene datos de más de un mes (${distinctMonths.join(', ')}). Por favor corrige el archivo para cargar solo un mes.`);
                    }

                    const fileMonth = distinctMonths[0];
                    if (parseInt(selectedMonth) !== fileMonth) {
                        throw new Error(`Error de Validación: Seleccionaste el mes ${months.find(m => m.val == selectedMonth)?.label}, pero el archivo contiene datos del mes ${fileMonth}.`);
                    }

                    const processedRuns = [];
                    const virtualBOM = {};

                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        if (!row || row.length < 5) continue;

                        const rawUnitCost = row[11]; // L
                        const rawRealQty = row[10]; // K (Real)
                        const rawStdQtyTotal = row[13]; // N (Standard)
                        const rawTotalUnits = row[5];

                        // DEBUG: Mapper confirmed by User (Col 10=Real, Col 13=Std)
                        // Removed Alert.

                        const unitCost = cleanCurrency(rawUnitCost);
                        const realQty = cleanCurrency(rawRealQty);
                        const stdQtyTotal = cleanCurrency(rawStdQtyTotal);
                        const producedUnits = cleanCurrency(rawTotalUnits);


                        // [FIX] Relaxed check: Allow rows without Component (col 7) to capture Units/Header info
                        if (!row[2]) continue;

                        // [FIX] Use Composite ID (Order + Week) to handle reused Order IDs in different weeks
                        // This ensures that "Piezas Fab" are counted for EACH production run, not just the first one.
                        const runId = `${row[2]}-${row[1]}`;

                        const runItem = {
                            id: runId,
                            originalOrderId: row[2].toString(),
                            date: `Mes ${row[0]} - Sem ${row[1]}`,
                            weekId: `Semana ${row[1]}`,
                            sku: row[3],
                            skuDesc: row[4],
                            units: producedUnits,
                            plannedUnits: cleanCurrency(row[6]),
                            component: row[8],
                            componentName: row[7],
                            realQty: realQty,
                            stdQtyTotal: stdQtyTotal,
                            unitCost: unitCost,
                            realCost: realQty * unitCost,
                            stdCost: stdQtyTotal * unitCost,
                            variance: (stdQtyTotal - realQty) * unitCost // Corrected: Std - Real. If Real > Std, result is Negative (Loss).
                        };

                        // [FIX] Use unique Run ID (Order-Week) to handle split runs
                        runItem.id = runId;
                        runItem.variance = runItem.stdCost - runItem.realCost; // Consistency check: Std - Real
                        processedRuns.push(runItem);

                        if (!virtualBOM[runItem.sku]) virtualBOM[runItem.sku] = {};
                        if (!virtualBOM[runItem.sku][runItem.component]) {
                            virtualBOM[runItem.sku][runItem.component] = {
                                stdQty: producedUnits > 0 ? (stdQtyTotal / producedUnits) : 0,
                                cost: unitCost,
                                type: 'Raw Material'
                            };
                        }
                    }

                    // 3. AGGREGATE SUMMARY (By Component & By SKU)
                    let totalStdCost = 0;
                    let totalRealCost = 0;
                    const varianceByComponent = {};
                    const skuAggregates = {};

                    // [FIX] Pre-scan for Max Units per Run ID to handle empty cells in file
                    // Some rows for the same Run ID might have empty/zero "Piezas Fab". We want the MAX value found.
                    const maxUnitsByRun = {};
                    processedRuns.forEach(r => {
                        if (!maxUnitsByRun[r.id] || r.units > maxUnitsByRun[r.id]) {
                            maxUnitsByRun[r.id] = r.units;
                        }
                    });

                    processedRuns.forEach(run => {
                        totalStdCost += run.stdCost;
                        totalRealCost += run.realCost;

                        // Component Aggregate
                        if (!varianceByComponent[run.component]) {
                            varianceByComponent[run.component] = {
                                name: run.componentName || run.component, // This is SKU
                                description: run.component, // This is Description (Key)
                                totalVariance: 0,
                                totalReal: 0,
                                totalStd: 0
                            };
                        }
                        varianceByComponent[run.component].totalVariance += run.variance;
                        varianceByComponent[run.component].totalReal += run.realCost;
                        varianceByComponent[run.component].totalStd += run.stdCost;

                        // SKU Aggregate
                        if (!skuAggregates[run.sku]) {
                            skuAggregates[run.sku] = {
                                sku: run.sku,
                                description: run.skuDesc || run.sku,
                                status: 'CERRADA', // Hardcoded as per request
                                netsuite: 'CERRADA', // Hardcoded as per request
                                totalUnits: 0,
                                totalPlanned: 0, // New field
                                processedOrders: new Set(),
                                totalReal: 0,
                                totalStd: 0,
                                totalVar: 0
                            };
                        }





                        // Units logic: A run is a component-line. Multiple runs belong to same Order.
                        if (!skuAggregates[run.sku].processedOrders.has(run.id)) {
                            // Use the MAX units found for this run, ignoring row order or empty cells
                            const validUnits = maxUnitsByRun[run.id] || 0;

                            skuAggregates[run.sku].totalUnits += validUnits;
                            // Try to get planned units from run.plannedUnits or default to run.units if missing (to avoid 0)
                            // Ideally, plannedUnits should also be maxed, but let's stick to units for now as per user request.
                            skuAggregates[run.sku].totalPlanned += (run.plannedUnits || validUnits);
                            skuAggregates[run.sku].processedOrders.add(run.id);
                        }

                        skuAggregates[run.sku].totalReal += run.realCost;
                        skuAggregates[run.sku].totalStd += run.stdCost;
                        skuAggregates[run.sku].totalVar += run.variance;
                    });

                    // Format SKU Details for Output
                    const skuDetails = Object.values(skuAggregates).map(item => {
                        const efficiencyProd = item.totalPlanned > 0 ? (item.totalUnits / item.totalPlanned) : 0;
                        return {
                            sku: item.sku,
                            description: item.description,
                            status: item.status,
                            netsuite: item.netsuite,
                            totalPlanned: item.totalPlanned,
                            totalUnits: item.totalUnits,
                            totalReal: item.totalReal,
                            totalStd: item.totalStd,
                            totalVar: item.totalVar,
                            efficiencyProd: efficiencyProd,
                            mermaPct: item.totalStd > 0 ? (item.totalVar / item.totalStd) * 100 : 0 // Keep as simple ratio
                        };
                    });

                    // Extract Month
                    const fileMonthIndex = processedRuns.length > 0 ? parseInt(processedRuns[0].date.split(' - ')[0].replace('Mes ', '')) : 0;

                    onDataProcessed({
                        year: parseInt(selectedYear),
                        monthIndex: fileMonthIndex || 1,
                        boms: virtualBOM,
                        runs: processedRuns,
                        summary: {
                            totalStdCost,
                            totalRealCost,
                            variance: totalStdCost - totalRealCost, // Corrected: Std - Real
                            efficiency: totalRealCost > 0 ? (totalStdCost / totalRealCost) : 0
                        },
                        details: Object.values(varianceByComponent).sort((a, b) => a.totalVariance - b.totalVariance), // Sort by most negative (worst)
                        skuDetails: skuDetails.sort((a, b) => a.totalVar - b.totalVar) // Sort by most negative (highest loss)
                    });

                } catch (err) {
                    console.error(err);
                    setError("Error al procesar. Verifica que el Excel tenga las 16 columnas correctas.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col gap-6">
                    {/* Year / Month Selection */}
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm animate-fade-in">
                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <span className="bg-blue-100 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center text-sm">1</span>
                            Selecciona el Periodo
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-2">Año</label>
                                <select
                                    value={selectedYear}
                                    onChange={(e) => setSelectedYear(parseInt(e.target.value))}
                                    className="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                                >
                                    {[2024, 2025, 2026, 2027].map(y => <option key={y} value={y}>{y}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-2">Mes</label>
                                <select
                                    value={selectedMonth}
                                    onChange={(e) => setSelectedMonth(e.target.value)}
                                    className="w-full rounded-lg border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-white"
                                >
                                    <option value="" disabled>-- Selecciona un Mes --</option>
                                    {months.map(m => {
                                        const isLoaded = existingHistory.some(h => h.monthIndex === m.val && h.year === selectedYear);
                                        return (
                                            <option key={m.val} value={m.val} disabled={isLoaded}>
                                                {m.label} {isLoaded ? '(Ya Cargado)' : ''}
                                            </option>
                                        );
                                    })}
                                </select>
                            </div>
                        </div>
                    </div>

                    {/* Dropzone */}
                    {/* Dropzone */}
                    <div className={`flex flex-col items-center justify-center p-12 border-2 border-dashed rounded-2xl transition-all relative group ${!selectedMonth || isLocked ? 'border-slate-200 bg-slate-50 cursor-not-allowed opacity-60' : 'border-blue-300 bg-blue-50 hover:bg-blue-100 cursor-pointer'}`}>
                        {selectedMonth && !isLocked && (
                            <input
                                type="file"
                                onChange={handleFileUpload}
                                className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                                accept=".xlsx, .xls"
                            />
                        )}

                        {isLocked ? (
                            <div className="text-center">
                                <div className="mx-auto h-16 w-16 mb-4 text-amber-500">
                                    <svg className="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                </div>
                                <h3 className="mt-2 text-xl font-bold text-amber-900">Periodo ya Cargado</h3>
                                <p className="mt-2 text-sm text-amber-800 max-w-md mx-auto">
                                    El mes de <strong>{months.find(m => m.val == selectedMonth)?.label} {selectedYear}</strong> ya existe en el historial.
                                    <br />Para cargar una nueva versión, primero elimina el registro existente desde la pestaña "Historial Mensual".
                                </p>
                            </div>
                        ) : (
                            <div className={`text-center ${loading ? 'opacity-50' : ''}`}>
                                <div className={`mx-auto h-16 w-16 mb-4 transition-transform group-hover:scale-110 ${!selectedMonth ? 'text-slate-300' : 'text-blue-500'}`}>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="1.5" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                                    </svg>
                                </div>

                                {!selectedMonth ? (
                                    <div>
                                        <h3 className="mt-2 text-lg font-bold text-slate-400">Selecciona un Mes arriba para continuar</h3>
                                        <p className="mt-1 text-sm text-slate-400">El área de carga se habilitará automáticamente.</p>
                                    </div>
                                ) : (
                                    <div>
                                        <h3 className="mt-2 text-xl font-bold text-slate-900">Sube tu Archivo Excel ({months.find(m => m.val == selectedMonth)?.label} {selectedYear})</h3>
                                        <p className="mt-2 text-sm text-slate-600">Arrastra y suelta o haz clic para seleccionar</p>
                                    </div>
                                )}

                                {loading && <p className="mt-6 text-blue-600 font-bold animate-pulse text-lg">Analizando y Validando archivo...</p>}
                                {error && (
                                    <div className="mt-6 bg-red-50 border-l-4 border-red-500 p-4 text-left max-w-lg mx-auto rounded shadow-sm">
                                        <div className="flex items-start">
                                            <div className="flex-shrink-0">
                                                <svg className="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                                    <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" />
                                                </svg>
                                            </div>
                                            <div className="ml-3">
                                                <h3 className="text-sm font-bold text-red-800">Error de Validación</h3>
                                                <div className="mt-1 text-sm text-red-700">{error}</div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    <div className="mt-10 z-20">
                        <button
                            onClick={(e) => { e.stopPropagation(); downloadTemplate(); }}
                            className="px-5 py-2.5 bg-white border border-slate-200 shadow-sm rounded-lg text-sm text-slate-600 hover:text-blue-600 hover:border-blue-200 font-bold transition-all z-30 pointer-events-auto flex items-center gap-2"
                        >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Descargar Plantilla de Ejemplo
                        </button>
                    </div>
                </div >

            );
        };

        // --- COMPANY MANAGER ---
        const CompanyManager = {
            STORAGE_KEY: 'cost_analyzer_companies',
            CURRENT_KEY: 'cost_analyzer_current_company',

            getCompanies: () => {
                const raw = localStorage.getItem(CompanyManager.STORAGE_KEY);
                return raw ? JSON.parse(raw) : [{ id: 'default', name: 'Grupo Alphalab de México', created_at: new Date().toISOString() }];
            },

            addCompany: (name) => {
                const companies = CompanyManager.getCompanies();
                const newCompany = {
                    id: 'comp_' + Date.now(),
                    name: name,
                    created_at: new Date().toISOString()
                };
                companies.push(newCompany);
                localStorage.setItem(CompanyManager.STORAGE_KEY, JSON.stringify(companies));
                return newCompany;
            },

            updateCompany: (id, newName) => {
                const companies = CompanyManager.getCompanies();
                const idx = companies.findIndex(c => c.id === id);
                if (idx !== -1) {
                    companies[idx].name = newName;
                    localStorage.setItem(CompanyManager.STORAGE_KEY, JSON.stringify(companies));
                    return true;
                }
                return false;
            },

            getActiveCompany: () => {
                const companies = CompanyManager.getCompanies();
                const currentId = localStorage.getItem(CompanyManager.CURRENT_KEY);
                return companies.find(c => c.id === currentId) || companies[0];
            },

            setActiveCompany: (id) => {
                localStorage.setItem(CompanyManager.CURRENT_KEY, id);
                window.location.reload();
            }
        };

        // --- HISTORY MANAGER (MULTI-COMPANY) ---
        const HistoryManager = {
            // Legacy Key for Reference/Migration: 'cost_analyzer_history_monthly_v1'

            getStorageKey: () => {
                const companyId = CompanyManager.getActiveCompany().id;
                return `cost_analyzer_history_${companyId}`;
            },

            init: () => {
                // MIGRATION LOGIC
                const legacyKey = 'cost_analyzer_history_monthly_v1';
                const legacyData = localStorage.getItem(legacyKey);

                if (legacyData) {
                    console.log("Migrating legacy data to default company...");
                    const defaultKey = `cost_analyzer_history_default`; // Matches default ID 'default'

                    if (!localStorage.getItem(defaultKey)) {
                        try {
                            localStorage.setItem(defaultKey, legacyData);
                            console.log("Migration successful (Direct copy).");
                            localStorage.removeItem(legacyKey);
                        } catch (e) {
                            if (e.name === 'QuotaExceededError' || e.code === 22) {
                                console.warn("Quota exceeded. Attempting migration with delete-first strategy...");
                                // DATA SAFETY: Read into memory is already done (legacyData var).
                                // We delete the source from disk to free space.
                                localStorage.removeItem(legacyKey);
                                try {
                                    localStorage.setItem(defaultKey, legacyData);
                                    console.log("Migration successful (Delete-first).");
                                } catch (e2) {
                                    console.error("CRITICAL: Data lost during migration due to persistent storage limits.", e2);
                                    alert("Error Crítico de Almacenamiento: No se pudo completar la migración por falta de espacio. Tus datos antiguos podrían haberse perdido del navegador.");
                                }
                            } else {
                                console.error("Migration Failed:", e);
                            }
                        }
                    } else {
                        // Destination exists (maybe partial run), ensure legacy is gone
                        localStorage.removeItem(legacyKey);
                    }
                }
            },

            saveMonth: (data) => {
                const monthIndex = data.monthIndex;
                const year = data.year || new Date().getFullYear();

                if (!monthIndex) return "Error: No se pudo identificar el mes.";

                const history = HistoryManager.load();

                // Remove existing only if matches Month AND Year
                const filtered = history.filter(h => !(h.monthIndex === monthIndex && h.year === year));

                filtered.push({
                    monthIndex: monthIndex,
                    year: year,
                    monthName: new Date(year, monthIndex - 1, 1).toLocaleString('es-MX', { month: 'long' }),
                    timestamp: new Date().toISOString(),
                    summary: data.summary,
                    details: data.details,
                    skuDetails: data.skuDetails || [],
                    runs: data.runs || [], // Critical for Dashboard analysis
                    boms: data.boms || {}
                });

                // Sort by Year then Month Index
                filtered.sort((a, b) => {
                    const yearDiff = (a.year || 2024) - (b.year || 2024);
                    if (yearDiff !== 0) return yearDiff;
                    return a.monthIndex - b.monthIndex;
                });

                try {
                    const str = JSON.stringify(filtered);
                    const payload = window.LZString ? LZString.compressToUTF16(str) : str;
                    localStorage.setItem(HistoryManager.getStorageKey(), payload);
                    return true;
                } catch (e) {
                    console.error("Storage Error:", e);
                    alert("Error: No hay suficiente espacio en el navegador para guardar. Intenta eliminar meses antiguos.");
                    return false;
                }

            },
            updateMonth: (monthIndex, year, updates) => {
                const history = HistoryManager.load();
                const index = history.findIndex(h => h.monthIndex === monthIndex && h.year === year);
                if (index === -1) return false;

                // Merge updates (e.g., comments)
                history[index] = { ...history[index], ...updates };
                try {
                    const str = JSON.stringify(history);
                    const payload = window.LZString ? LZString.compressToUTF16(str) : str;
                    localStorage.setItem(HistoryManager.getStorageKey(), payload);
                    return true;
                } catch (e) {
                    console.error("Storage Update Error:", e);
                    return false;
                }
            },
            deleteMonth: (monthIndex, year) => {
                const history = HistoryManager.load();
                const filtered = history.filter(h => {
                    if (year) return !(h.monthIndex === monthIndex && h.year === year);
                    return h.monthIndex !== monthIndex;
                });
                const str = JSON.stringify(filtered);
                localStorage.setItem(HistoryManager.getStorageKey(), window.LZString ? LZString.compressToUTF16(str) : str);
                return filtered;
            },
            load: () => {
                const raw = localStorage.getItem(HistoryManager.getStorageKey());
                if (!raw) return [];
                
                if (raw.startsWith('[')) {
                    // Legacy uncompressed
                    return JSON.parse(raw);
                } else if (window.LZString) {
                    // Compressed
                    try {
                        const decompressed = LZString.decompressFromUTF16(raw);
                        return decompressed ? JSON.parse(decompressed) : [];
                    } catch (e) {
                        console.error("Failed to parse compressed history:", e);
                        return [];
                    }
                }
                return [];
            },
            clear: () => localStorage.removeItem(HistoryManager.getStorageKey())
        };

        // Auto-run migration check on script load
        HistoryManager.init();

        // --- AI ANALYZER ---
        const generateAIInsight = (productSKU, runs) => {
            const productRuns = runs.filter(r => r.sku === productSKU);
            if (productRuns.length === 0) return "No hay datos de producción para este producto.";

            // 1. Aggregations using pre-calculated values (Source of Truth)
            let totalReal = 0;
            let totalStd = 0;
            let totalVar = 0;

            // Group by Order to find specific bad orders
            const ordersMap = {};

            productRuns.forEach(r => {
                totalReal += r.realCost;
                totalStd += r.stdCost;
                totalVar += r.variance;

                if (!ordersMap[r.id]) {
                    ordersMap[r.id] = { id: r.id, variance: 0, real: 0, std: 0, units: r.units };
                }
                ordersMap[r.id].variance += r.variance;
                ordersMap[r.id].real += r.realCost;
                ordersMap[r.id].std += r.stdCost;
            });

            const efficiency = totalReal > 0 ? (totalStd / totalReal) : 0;
            const orders = Object.values(ordersMap);

            // Sort orders: Worst (Most Negative Variance) to Best (Highest Positive Variance)
            orders.sort((a, b) => a.variance - b.variance);

            const criticalOrders = orders.filter(o => o.variance < 0).slice(0, 3);
            const subOptimalCount = orders.filter(o => o.variance < 0).length;
            const efficientCount = orders.filter(o => o.variance >= 0).length;

            // Generate Insight HTML
            let html = `<div class="space-y-3">`;

            // A. Global Summary
            const isCritical = efficiency < 0.95;
            const statusIcon = isCritical ? '⚠️' : (efficiency > 1.02 ? '✅' : 'ℹ️');
            const statusColor = isCritical ? 'text-red-700' : (efficiency > 1.02 ? 'text-green-700' : 'text-blue-700');

            html += `
                <div class="${statusColor} font-medium border-b border-gray-100 pb-2">
                    <span class="text-lg mr-2">${statusIcon}</span>
                    <strong>Resumen Global:</strong> ${isCritical ? 'Eficiencia Crítica' : 'Desempeño Controlado'} (${(efficiency * 100).toFixed(1)}%).
                    Se acumula un ${totalVar < 0 ? 'sobrecosto' : 'ahorro'} de <strong>${formatCurrency(totalVar)}</strong> en ${orders.length} órdenes.
                </div>
            `;

            // B. Critical Orders Analysis
            if (criticalOrders.length > 0) {
                html += `<div>
                    <div class="text-xs uppercase tracking-wider text-red-600 font-bold mb-1">🔍 Órdenes con Mayor Desviación</div>
                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-1">`;
                criticalOrders.forEach(o => {
                    const ordEff = o.real > 0 ? (o.std / o.real) * 100 : 0;
                    html += `<li>
                        <strong>Orden ${o.id}</strong>: <span class="text-red-600 font-semibold">${formatCurrency(o.variance)}</span> 
                        <span class="text-xs text-slate-500">(Eficiencia: ${ordEff.toFixed(1)}% - ${o.units} pzs)</span>
                    </li>`;
                });
                html += `</ul></div>`;
            }

            // C. Pattern Analysis
            html += `<div class="text-sm text-slate-600 italic bg-slate-50 p-2 rounded">
                📊 <strong>Patrón Detectado:</strong> El ${((subOptimalCount / orders.length) * 100).toFixed(0)}% de las órdenes presentaron sobrecostos. 
                ${isCritical ? 'Se recomienda revisar ajuste de máquinas o calidad de materia prima en las órdenes señaladas.' : 'La operación mantiene un estándar saludable.'}
            </div>`;

            html += `</div>`;
            return html;
        };

        const ProductDetail = ({ data, sku, onClose }) => {
            // New signature: generateAIInsight(sku, runs)
            const insight = useMemo(() => generateAIInsight(sku, data.runs), [sku, data.runs]);

            const productRuns = data.runs.filter(r => r.sku === sku);

            // Group by Order & Calculate Global Metrics
            const byOrder = {};
            let globalTotalUnits = 0;
            let globalTotalStd = 0;
            let globalTotalVar = 0; // Total Money Variance

            productRuns.forEach(r => {
                if (!byOrder[r.id]) {
                    byOrder[r.id] = { id: r.id, date: r.date, units: r.units, components: [] };
                    globalTotalUnits += r.units; // Sum units once per order
                }

                // const bom = data.boms[r.sku]?.[r.component]; // No longer needed for calc, r has pre-calc
                // Re-calculate local std/variance for display consistency if needed, 
                // but we trust r.variance from UploadZone as per previous step fixes.

                // For percentage calc:
                // r.variance is Money Variance. 
                // To get Qty Variance %: (RealQty - StdQty) / StdQty
                // We have r.realQty, r.stdQtyTotal

                const stdQty = r.stdQtyTotal || 0;
                const variancePct = stdQty > 0 ? ((r.realQty - stdQty) / stdQty) * 100 : 0;

                globalTotalStd += r.stdCost;
                globalTotalVar += r.variance;

                byOrder[r.id].components.push({
                    name: r.component,
                    real: r.realQty,
                    std: stdQty,
                    variance: r.realQty - stdQty, // Qty Variance
                    costVar: r.variance, // Money Variance
                    costVar: r.variance, // Money Variance
                    varPct: variancePct,
                    unitCost: r.realQty > 0 ? (r.realCost / r.realQty) : 0 // approx unit cost of component
                });
            });

            // Global Merma % (Financial)
            // If Standard is $100 and Variance is $10. Merma is 10%.
            const globalMermaPct = globalTotalStd > 0 ? (globalTotalVar / globalTotalStd) * 100 : 0;

            // Build Traffic Light Class
            let mermaColorClass = "bg-green-100 text-green-700 border-green-200";
            if (globalMermaPct > 5) mermaColorClass = "bg-red-100 text-red-700 border-red-200";
            else if (globalMermaPct > 3) mermaColorClass = "bg-yellow-100 text-yellow-800 border-yellow-200";

            const handleExportDetail = () => {

                            'Q. Std': comp.std,
                            'Cto. Unit. Prom.': comp.unitCost,
                            'Var. Unit.': comp.variance,
                            '% Var': (comp.varPct / 100), // Format as percentage in Excel
                            'Var. Dinero': comp.costVar
                        });
                    });
                });

                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Detalle Producción");
                XLSX.writeFile(wb, `Detalle_Produccion_${sku}.xlsx`);
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" onClick={onClose}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col" onClick={e => e.stopPropagation()}>

                        {/* HEADER */}
                        <div className="p-6 border-b border-gray-100 bg-slate-50 rounded-t-2xl space-y-4">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h3 className="text-2xl font-bold text-slate-900">{sku}</h3>
                                    <p className="text-sm text-slate-500">Detalle de producción</p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={handleExportDetail} className="px-3 py-1.5 bg-green-50 text-green-700 hover:bg-green-100 rounded-lg text-sm font-bold flex items-center gap-1 transition-colors border border-green-200">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                        Exportar Excel
                                    </button>
                                    <button onClick={onClose} className="p-2 hover:bg-slate-200 rounded-full text-slate-500">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                </div>
                            </div>

                            {/* GLOBAL INDICATORS */}
                            <div className="flex flex-wrap gap-4">
                                <div className="px-4 py-2 bg-white border border-slate-200 rounded-lg shadow-sm flex items-center gap-3">
                                    <div className="p-2 bg-blue-50 text-blue-600 rounded-md">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                                    </div>
                                    <div>
                                        <div className="text-xs text-slate-500 uppercase font-bold">Total Pzs Producidas</div>
                                        <div className="text-lg font-bold text-slate-900">{globalTotalUnits.toLocaleString()}</div>
                                    </div>
                                </div>

                                <div className={`px-4 py-2 border rounded-lg shadow-sm flex items-center gap-3 ${globalMermaPct >= 0 ? 'bg-green-100 text-green-700 border-green-200' : 'bg-red-100 text-red-700 border-red-200'}`}>
                                    <div className="p-2 bg-white/50 rounded-md">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                                    </div>
                                    <div>
                                        <div className="text-xs opacity-80 uppercase font-bold">{globalMermaPct >= 0 ? 'Eficiencia Promedio' : 'Merma Promedio'}</div>
                                        <div className="text-lg font-bold">{globalMermaPct >= 0 ? '+' : ''}{globalMermaPct.toFixed(2)}%</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="p-6 overflow-y-auto flex-1 space-y-8 custom-scrollbar">
                            {/* AI INSIGHT */}
                            <div className="p-4 bg-indigo-50 border border-indigo-100 rounded-xl flex gap-4">
                                <div className="p-2 bg-indigo-100 rounded-lg h-fit text-indigo-600">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                </div>
                                <div>
                                    <h4 className="font-bold text-indigo-900 mb-1">IA Smart Insight</h4>
                                    <p className="text-indigo-800 text-sm leading-relaxed" dangerouslySetInnerHTML={{ __html: insight.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') }}></p>
                                </div>
                            </div>

                            {/* ORDERS TABLE */}
                            <div className="space-y-4">
                                {Object.values(byOrder).map(order => (
                                    <div key={order.id} className="border border-slate-200 rounded-xl overflow-hidden">
                                        <div className="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                                            <span className="font-semibold text-slate-700">Orden: {order.id}</span>
                                            <span className="text-sm text-slate-500">{order.date} | {order.units} uds</span>
                                        </div>
                                        <table className="min-w-full text-sm">
                                            <thead>
                                                <tr className="text-slate-400 border-b border-slate-100">
                                                    <th className="px-4 py-2 text-left font-normal pl-8">Componente</th>
                                                    <th className="px-4 py-2 text-right font-normal">Q. Real</th>
                                                    <th className="px-4 py-2 text-right font-normal">Q. Std</th>
                                                    <th className="px-4 py-2 text-right font-normal">Cto. Unit Prom.</th>
                                                    <th className="px-4 py-2 text-right font-normal">Var Unit</th>
                                                    <th className="px-4 py-2 text-right font-normal">% Var</th>
                                                    <th className="px-4 py-2 text-right font-normal">Var Dinero</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {order.components.map((comp, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-50/50">
                                                        <td className="px-4 py-2 pl-8 text-slate-600">{comp.name}</td>
                                                        <td className="px-4 py-2 text-right text-slate-900 font-medium">{comp.real.toLocaleString('es-MX', { maximumFractionDigits: 0 })}</td>
                                                        <td className="px-4 py-2 text-right text-slate-400">{comp.std.toLocaleString('es-MX', { maximumFractionDigits: 0 })}</td>
                                                        <td className="px-4 py-2 text-right text-slate-500">{formatCurrency(comp.unitCost)}</td>
                                                        <td className={`px-4 py-2 text-right ${comp.variance > 0 ? 'text-red-500' : 'text-green-500'}`}>{comp.variance > 0 ? '+' : ''}{comp.variance.toLocaleString('es-MX', { maximumFractionDigits: 0 })}</td>
                                                        <td className={`px-4 py-2 text-right font-medium ${comp.varPct > 0 ? 'text-red-500' : 'text-green-500'}`}>
                                                            {comp.varPct > 0 ? '+' : ''}{comp.varPct.toFixed(1)}%
                                                        </td>
                                                        <td className={`px-4 py-2 text-right font-bold ${comp.costVar < 0 ? 'text-red-600' : 'text-green-600'}`}>{formatCurrency(comp.costVar)}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const UnitCostComparisonTable = ({ currentMonth, prevMonth }) => {
            if (!prevMonth || !prevMonth.skuDetails) {
                return (
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mt-8">
                        <h3 className="font-bold text-slate-800 mb-2">Comparativo de Costos Unitarios</h3>
                        <p className="text-sm text-slate-400">No hay mes anterior disponible para realizar la comparación.</p>
                    </div>
                );
            }

            const prevSkusMap = new Map();
            prevMonth.skuDetails.forEach(s => prevSkusMap.set(s.sku, s));

            // Combine SKUs from both months to ensure full coverage
            const allSkuNames = new Set([...currentMonth.skuDetails.map(s => s.sku), ...prevMonth.skuDetails.map(s => s.sku)]);

            const rows = Array.from(allSkuNames).map(sku => {
                const curr = currentMonth.skuDetails.find(s => s.sku === sku) || { totalUnits: 0, totalReal: 0, realUnitCost: 0 };
                const prev = prevSkusMap.get(sku) || { totalUnits: 0, totalReal: 0, realUnitCost: 0 };

                // Calculate Unit Costs (Sanity check vs stored value)
                const currUnitCost = curr.totalUnits > 0 ? curr.totalReal / curr.totalUnits : 0;
                const prevUnitCost = prev.totalUnits > 0 ? prev.totalReal / prev.totalUnits : 0;

                const varAmount = currUnitCost - prevUnitCost;
                const varPct = prevUnitCost > 0 ? (varAmount / prevUnitCost) * 100 : 0;

                // User Rule: < 0% Red, > 0% Green
                const isRed = varPct < 0;
                const isGreen = varPct > 0;
                const colorClass = isRed ? 'text-red-600 font-bold' : (isGreen ? 'text-green-600 font-bold' : 'text-slate-500');
                const bgClass = isRed ? 'bg-red-50' : (isGreen ? 'bg-green-50' : '');

                return {
                    sku,
                    prevUnits: prev.totalUnits,
                    prevTotal: prev.totalReal,
                    prevUnitCost,
                    currUnits: curr.totalUnits,
                    currTotal: curr.totalReal,
                    currUnitCost,
                    varAmount,
                    varPct,
                    colorClass,
                    bgClass
                };
            }).sort((a, b) => a.sku.localeCompare(b.sku)); // Sort Alphabetically

            const exportComparisonToExcel = () => {
                const wsData = rows.map(r => ({
                    SKU: r.sku,
                    [`Piezas Prod (${prevMonth.monthName})`]: r.prevUnits,
                    [`Costo Real (${prevMonth.monthName})`]: r.prevTotal,
                    [`Costo Unitario (${prevMonth.monthName})`]: r.prevUnitCost,
                    [`Piezas Prod (${currentMonth.monthName})`]: r.currUnits,
                    [`Costo Real (${currentMonth.monthName})`]: r.currTotal,
                    [`Costo Unitario (${currentMonth.monthName})`]: r.currUnitCost,
                    'Variación $': r.varAmount,
                    'Variación %': r.varPct / 100 // Format as pct in Excel
                }));

                const ws = XLSX.utils.json_to_sheet(wsData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Comparativo Mensual");
                XLSX.writeFile(wb, `Comparativo_Unitario_${currentMonth.monthName}_vs_${prevMonth.monthName}.xlsx`);
            };

            return (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mt-8 overflow-hidden">
                    <div className="flex justify-between items-end mb-4">
                        <div>
                            <h3 className="font-bold text-lg text-slate-800">Comparativo de Costos Unitarios</h3>
                            <p className="text-sm text-slate-500">Mes Actual ({currentMonth.monthName}) vs Mes Anterior ({prevMonth.monthName})</p>
                        </div>
                        <button
                            onClick={exportComparisonToExcel}
                            className="bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 px-3 rounded-lg flex items-center gap-2 shadow-sm transition-colors"
                        >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3M3 17V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
                            Exportar Comparativo
                        </button>
                    </div>

                    <div className="overflow-x-auto border border-slate-200 rounded-lg max-h-[500px] custom-scrollbar">
                        <table className="min-w-full text-xs text-right border-collapse relative">
                            <thead className="bg-[#0f172a] text-white font-semibold uppercase tracking-wider sticky top-0 z-20 shadow-sm">
                                <tr>
                                    <th className="px-3 py-3 text-left sticky left-0 z-30 bg-[#0f172a] border-r border-slate-600">SKU</th>
                                    <th colSpan="3" className="px-3 py-2 text-center border-r border-slate-600 bg-slate-800/50">{prevMonth.monthName} (Anterior)</th>
                                    <th colSpan="3" className="px-3 py-2 text-center border-r border-slate-600 bg-blue-900/50">{currentMonth.monthName} (Actual)</th>

        // [NEW] Annual SKU Summary Table
        const AnnualSkuTable = ({ history }) => {
            const [sortConfig, setSortConfig] = useState({ key: 'totalVar', direction: 'asc' }); // Default: Loss first (Negative Var)

            const aggregatedData = useMemo(() => {
                const skuMap = {};

                if (!history) return [];

                history.forEach(h => {
                    if (h.skuDetails) {
                        h.skuDetails.forEach(d => {
                            if (!skuMap[d.sku]) {
                                skuMap[d.sku] = {
                                    sku: d.sku,
                                    description: d.description,
                                    netsuite: d.netsuite,
                                    status: d.status,
                                    totalUnits: 0,
                                    totalStd: 0,
                                    totalReal: 0
                                };
                            }
                            skuMap[d.sku].totalUnits += (d.totalUnits || 0);
                            skuMap[d.sku].totalStd += (d.totalStd || 0);
                            skuMap[d.sku].totalReal += (d.totalReal || 0);
                            // Update metadata to latest if available
                            if (d.description) skuMap[d.sku].description = d.description;
                            if (d.status) skuMap[d.sku].status = d.status;
                        });
                    }
                });

                return Object.values(skuMap).map(item => {
                    const totalVar = item.totalStd - item.totalReal;
                    // Merma % logic:Variance % logic: (Std - Real) / Std. Negative = Loss.
                    const mermaPct = item.totalStd !== 0 ? ((totalVar / item.totalStd) * 100) : 0;
                    return { ...item, totalVar, mermaPct };
                });
            }, [history]);

            const sortedData = useMemo(() => {
                let sortableItems = [...aggregatedData];
                if (sortConfig.key) {
                    sortableItems.sort((a, b) => {
                        if (a[sortConfig.key] < b[sortConfig.key]) {
                            return sortConfig.direction === 'asc' ? -1 : 1;
                        }
                        if (a[sortConfig.key] > b[sortConfig.key]) {
                            return sortConfig.direction === 'asc' ? 1 : -1;
                        }
                        return 0;
                    });
                }
                return sortableItems;
            }, [aggregatedData, sortConfig]);

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') {
                    direction = 'desc';

            const formatCurrency = (val) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(val);

                                            <td className={`px-3 py-2 text-center font-bold ${skuItem.totalVar < 0 ? 'text-red-600' : 'text-slate-600'}`}>
                                                {skuItem.mermaPct.toFixed(2)}%

        };

        const HistoryView = ({ onRefresh, onLoadHistory, onDelete }) => {
            const [history, setHistory] = useState([]);
            const [selectedYear, setSelectedYear] = useState(2025); // Default to current focus year
            const [expandedMonth, setExpandedMonth] = useState(null);
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });

            useEffect(() => {
                setHistory(JSON.parse(JSON.stringify(HistoryManager.load())));
            }, [onRefresh]); // Reload when onRefresh signal comes (usually from parent state change)

            // Filter history by year
            const filteredHistory = history.filter(h => (h.year || 2024) === selectedYear);

            const handleDelete = (monthIndex, year) => {
                const targetYear = year || 2024;
                if (confirm(`¿Estás seguro de eliminar el historial del Mes ${monthIndex} (${targetYear})?`)) {
                    // Delegate to parent to handle "Global State" cleanup (like clearing dashboard)
                    if (onDelete) {
                        onDelete(monthIndex, targetYear);
                    } else {
                        // Fallback (should not happen if App is updated)
                        HistoryManager.deleteMonth(monthIndex, targetYear);
                        setHistory(JSON.parse(JSON.stringify(HistoryManager.load())));
                    }
                }
            };

            const toggleDetail = (monthIndex) => {
                setExpandedMonth(expandedMonth === monthIndex ? null : monthIndex);
            };

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') {
                    direction = 'desc';
                }
                setSortConfig({ key, direction });
            };

            const getSortedData = (data) => {
                if (!sortConfig.key) return data;
                return [...data].sort((a, b) => {
                    if (a[sortConfig.key] < b[sortConfig.key]) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (a[sortConfig.key] > b[sortConfig.key]) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });
            };

            const handleUpdateComment = (formattedMonthIndex, year, sku, comment) => {
                const monthIdx = parseInt(formattedMonthIndex);
                const recordIndex = history.findIndex(h => h.monthIndex === monthIdx && h.year === year);
                if (recordIndex === -1) return;

                const record = history[recordIndex];
                const currentComments = record.comments || {};
                const newComments = { ...currentComments, [sku]: comment };

                // Persist
                HistoryManager.updateMonth(monthIdx, year, { comments: newComments });

                // Update local state to reflect change immediately without full reload if possible, 
                // or just reload history
                setHistory(JSON.parse(JSON.stringify(HistoryManager.load())));
            };

            const exportTableToExcel = (record) => {
                const wsData = record.skuDetails.map(item => ({
                    Mes: record.monthName,
                    SKU: item.sku,
                    Descripcion: item.description,
                    Estatus: item.status,
                    Piezas_Planificadas: item.totalPlanned,
                    Piezas_Fabricadas: item.totalUnits,
                    Importe_STD: item.totalStd,
                    Importe_Real: item.totalReal,
                    Variacion: item.totalVar,
                    Eficiencia: (item.efficiencyProd || 0),
                    Merma_Porcentaje: item.mermaPct / 100,
                    NetSuite: item.netsuite
                }));
                const ws = XLSX.utils.json_to_sheet(wsData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Detalle SKU");
                XLSX.writeFile(wb, `Reporte_Mensual_Mes_${record.monthIndex}.xlsx`);
            };

            const exportAnalysisToWord = (analysisText, monthName, skuDetails = []) => {
                const styles = `
                    <style>
                        body { font-family: 'Segoe UI', Arial, sans-serif; color: #333; line-height: 1.5; }
                        h1 { color: #1e3a8a; font-size: 24px; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px; margin-bottom: 20px; }
                        h2, h3 { color: #1e40af; margin-top: 20px; }
                        .report-container { padding: 20px; }
                        .financial-table { width: 100%; border-collapse: collapse; margin-top: 25px; font-size: 10pt; }
                        .financial-table th { background-color: #1e3a8a; color: white; padding: 8px; text-align: left; }
                        .financial-table td { border-bottom: 1px solid #e2e8f0; padding: 6px; }
                        .financial-table tr:nth-child(even) { background-color: #f8fafc; }
                        .negative { color: #dc2626; font-weight: bold; }
                        .positive { color: #16a34a; font-weight: bold; }
                        .footer { margin-top: 50px; border-top: 1px solid #cbd5e1; padding-top: 20px; display: flex; justify-content: space-between; }
                        .signature-line { width: 40%; border-top: 1px solid #333; margin-top: 40px; text-align: center; font-size: 12px; }
                    </style>
                `;

                const tableRows = skuDetails.length > 0 ? skuDetails.map(item => `
                    <tr>
                        <td>${item.sku}</td>
                        <td>${item.description}</td>
                        <td style="text-align: right">${item.totalUnits.toLocaleString()}</td>
                        <td style="text-align: right">${formatCurrency(item.totalReal)}</td>
                        <td style="text-align: right" class="${item.totalVar > 0 ? 'negative' : 'positive'}">
                            ${formatCurrency(item.totalVar)}
                        </td>
                        <td style="text-align: center">${(item.mermaPct).toFixed(2)}%</td>
                    </tr>
                `).join('') : '<tr><td colspan="6">Sin detalle disponible</td></tr>';

                const tableHTML = `
                    <h3>Detalle por Producto (SKU)</h3>
                    <table class="financial-table">
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>Descripción</th>
                                <th style="text-align: right">Prod. (Pzs)</th>
                                <th style="text-align: right">Costo Real</th>
                                <th style="text-align: right">Variación ($)</th>
                                <th style="text-align: center">% Merma</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                `;

                const footerHTML = `
                    <div class="footer">
                        <div class="signature-line">Gerencia de Planta</div>
                        <div class="signature-line">Contraloría</div>
                    </div>
                `;

                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>Análisis Mensual</title>${styles}</head><body>`;

                const footer = "</body></html>";
                const sourceHTML = header + `
                    <div class="report-container">
                        <h1>Reporte de Costos de Producción - ${monthName}</h1>
                        ${analysisText}
                        ${tableHTML}
                        ${footerHTML}
                    </div>` + footer;

                const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
                const fileDownload = document.createElement("a");
                document.body.appendChild(fileDownload);
                fileDownload.href = source;
                fileDownload.download = `Analisis_Ejecutivo_${monthName}.doc`;
                fileDownload.click();
                document.body.removeChild(fileDownload);
            };

            // NEW: Returns DATA OBJECT instead of HTML String
            const calculateMonthlyInsights = (currentMonth, prevMonth) => {
                const skus = currentMonth.skuDetails || [];
                if (skus.length === 0) return null;

                // Top 5s
                const topMerma = [...skus].sort((a, b) => a.totalVar - b.totalVar).slice(0, 5); // Most Negative (Losses)
                const topMermaPct = [...skus].sort((a, b) => (a.mermaPct || 0) - (b.mermaPct || 0)).slice(0, 5); // Most Negative
                const topVol = [...skus].sort((a, b) => b.totalUnits - a.totalUnits).slice(0, 5);

                const data = {
                    topMerma,
                    topSavings: [...skus].sort((a, b) => b.totalVar - a.totalVar).slice(0, 5).filter(s => s.totalVar > 0), // Top Absolute Savings
                    topMermaPct,
                    topVol,
                    history: null
                };

                // Helper to get component variances for a SKU
                const getCompVars = (runs, sku) => {
                    const map = {};
                    runs.filter(r => r.sku === sku).forEach(r => {
                        if (!map[r.component]) map[r.component] = {
                            var: 0,
                            name: r.componentName || r.component,
                            realCost: 0,
                            realQty: 0,
                            stdCost: 0,
                            stdQty: 0
                        };
                        map[r.component].var += r.variance;
                        map[r.component].realCost += r.realCost;
                        map[r.component].realQty += r.realQty;
                        map[r.component].stdCost += r.stdCost;
                        map[r.component].stdQty += (r.stdQtyTotal || 0);
                    });
                    return map;
                };

                // Driver Logic with Price vs Usage Analysis
                const getAbsoluteDriver = (skuItem) => {
                    if (!currentMonth.runs) return null;
                    const curComps = getCompVars(currentMonth.runs, skuItem.sku);

                    let bestComp = null;
                    let maxImpact = 0;

                    // Find biggest driver
                    Object.keys(curComps).forEach(comp => {
                        const val = curComps[comp].var;
                        if (Math.sign(val) === Math.sign(skuItem.totalVar)) {
                            if (Math.abs(val) > maxImpact) {
                                maxImpact = Math.abs(val);
                                bestComp = { code: comp, ...curComps[comp] };
                            }
                        }
                    });

                    if (bestComp) {
                        // Decomposition Logic
                        // Variance = (StdQty - RealQty) * StdPrice  [Usage]
                        //          + (StdPrice - RealPrice) * RealQty [Price]

                        const avgStdPrice = bestComp.stdQty > 0 ? (bestComp.stdCost / bestComp.stdQty) : 0;
                        const avgRealPrice = bestComp.realQty > 0 ? (bestComp.realCost / bestComp.realQty) : 0;

                        // Note: Variance convention in this app is: Std - Real (Savings = Positive)
                        // Usage Var = (StdQty - RealQty) * AvgStdPrice
                        // Price Var = (AvgStdPrice - AvgRealPrice) * RealQty

                        const usageVar = (bestComp.stdQty - bestComp.realQty) * avgStdPrice;
                        const priceVar = (avgStdPrice - avgRealPrice) * bestComp.realQty;

                        let mainFactor = 'usage'; // default
                        if (Math.abs(priceVar) > Math.abs(usageVar)) {
                            mainFactor = 'price';
                        }

                        // Find MoM context
                        let prevVal = 0;
                        let prevRealPrice = 0;
                        let prevRealCost = 0;

                        if (prevMonth && prevMonth.runs) {
                            const prevComps = getCompVars(prevMonth.runs, skuItem.sku);
                            const prevCompData = prevComps[bestComp.code];
                            if (prevCompData) {
                                prevVal = prevCompData.var;
                                prevRealPrice = prevCompData.realQty > 0 ? (prevCompData.realCost / prevCompData.realQty) : 0;
                                prevRealCost = prevCompData.realCost;
                            }
                        }

                        return {
                            name: bestComp.name,
                            val: bestComp.var,
                            prevVal: prevVal,
                            diff: bestComp.var - prevVal,
                            factor: mainFactor,
                            usageImpact: usageVar,
                            priceImpact: priceVar,
                            realPrice: avgRealPrice,
                            stdPrice: avgStdPrice,
                            prevRealPrice: prevRealPrice,
                            realCost: bestComp.realCost,
                            prevRealCost: prevRealCost
                        };
                    }
                    return null;
                };

                // Apply Absolute Drivers to the main lists
                data.topMerma = data.topMerma.map(i => ({ ...i, driver: getAbsoluteDriver(i) }));
                data.topSavings = data.topSavings.map(i => ({ ...i, driver: getAbsoluteDriver(i) }));


                // MoM Comparison Logic
                if (prevMonth) {

                    const unitVarPct = prevTotalUnits > 0 ? (unitVar / prevTotalUnits) * 100 : 0;

                    const prevSkusMap = new Map();
                    if (prevMonth.skuDetails) {
                        prevMonth.skuDetails.forEach(s => prevSkusMap.set(s.sku, s));
                    }

                    const skuDeltas = [];
                    skus.forEach(currSku => {
                        const prevSku = prevSkusMap.get(currSku.sku);
                        if (prevSku) {
                            const deltaVar = currSku.totalVar - prevSku.totalVar;
                            skuDeltas.push({
                                sku: currSku.sku,
                                delta: deltaVar,
                                currVar: currSku.totalVar,
                                prevVar: prevSku.totalVar,
                                currUnits: currSku.totalUnits,

                                // Pass full objects for deeper driver analysis if needed

                                prevSkuObj: prevSku
                            });

                    const topImproved = [...skuDeltas].sort((a, b) => b.delta - a.delta).slice(0, 3).filter(d => d.delta > 100);

                                    driver = {
                                        name: curComps[comp]?.name || prevComps[comp]?.name || comp,
                                        code: comp,
                                        delta: delta
                                    };
                                }
                            }
                        });

                        }
                        return null;

        const Dashboard = ({ data, history, onReset, isPreview, onConfirmSave }) => {
            const [selectedSku, setSelectedSku] = useState(null);
            const [sortBy, setSortBy] = useState('variance'); // 'variance' | 'sku'

            // Safety check: ensure data.runs exists. If not (legacy history), fallback to empty or skuDetails
            const skus = useMemo(() => {
                let skuList = [];
                if (data.runs && data.runs.length > 0) {
                    skuList = [...new Set(data.runs.map(r => r.sku))];

                    skuList = data.skuDetails.map(s => s.sku);
                }

                // Sort the SKU list based on the selected criteria
                return skuList.sort((a, b) => {
                    if (sortBy === 'sku') return a.localeCompare(b);

                    // For variance sorting, we need to calculate/find the variance for each SKU
                    const getVar = (skuName) => {
                        if (data.runs && data.runs.length > 0) {
                            return data.runs.filter(r => r.sku === skuName).reduce((acc, r) => acc + r.variance, 0);
                        } else if (data.skuDetails) {
                            const det = data.skuDetails.find(d => d.sku === skuName);
                            return det ? det.totalVar : 0;
                        }
                        return 0;
                    };
                    return getVar(a) - getVar(b); // Ascending variance (most negative / highest loss first)

            }, [data.runs, data.skuDetails, sortBy]);

            useEffect(() => {
                const ctx = document.getElementById('trendChart');
                if (ctx && window.Chart) {

                    if (chartStatus != undefined) chartStatus.destroy();

                    // Logic for Top 10 Negative Variances (Losses)
                    // We need a sorted list of all items by variance descending
                    const allDetails = data.details || []; // Assuming data.details holds per-product summaries if available, effectively details usually maps to top level variances. 
                    // Actually, data.details is used in original code. Let's see if we can derive from runs if needed or use details.
                    // The original code used data.details.slice(0, 5). Let's sort data.details first to be sure.
                    const sortedDetails = [...allDetails].sort((a, b) => a.totalVariance - b.totalVariance); // Ascending (Most Negative First)
                    const top10 = sortedDetails.slice(0, 10);

                    const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 400);
                    gradient.addColorStop(0, 'rgba(239, 68, 68, 0.9)'); // Strong Red
                    gradient.addColorStop(1, 'rgba(248, 113, 113, 0.4)'); // Light Red

                    new window.Chart(ctx, {

                            datasets: [{
                                label: 'Sobreconsumo (MXN)',

                        options: {

                            plugins: {
                                legend: { display: false },
                                title: {
                                    display: true,
                                    text: 'Top 10 Variaciones Negativas (Fugas)',
                                    font: { size: 16, weight: 'bold' },
                                    color: '#1e293b'
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(255, 255, 255, 0.9)',
                                    titleColor: '#1e293b',
                                    bodyColor: '#1e293b',
                                    borderColor: '#e2e8f0',
                                    borderWidth: 1,
                                    callbacks: {
                                        label: function (context) {
                                            let label = context.dataset.label || '';
                                            if (label) {
                                                label += ': ';

                                            if (context.parsed.y !== null) {
                                                label += new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(context.parsed.y);
                                            }
                                            return label;

                            },
                            scales: {

                                    beginAtZero: true,
                                    grid: { color: '#f1f5f9' },
                                    ticks: { color: '#64748b' }

                                x: {

                                    ticks: { color: '#64748b', maxRotation: 45, minRotation: 45 }
                                }
                            }
